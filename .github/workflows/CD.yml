name: Build
run-name: Build ${{ inputs.platform }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
        platform:
            description: 'Platform to export'
            required: true
            default: windows
            type: choice
            options:
              - windows
              - linux
              - mac
              - all

permissions:
  contents: write
  actions: read

env:
    GAME_NAME: MortalSurvivor

jobs:
  export-windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    uses: ./.github/workflows/export-game.yml
    with:
      platform: windows
      preset: "Windows Desktop"
      extension: exe
      game_name: MortalSurvivor

  export-linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    uses: ./.github/workflows/export-game.yml
    with:
      platform: linux
      preset: "Linux"
      extension: x86_64
      game_name: MortalSurvivor

  export-mac:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'mac' }}
    uses: ./.github/workflows/export-game.yml
    with:
      platform: mac
      preset: "macOS"
      extension: zip
      game_name: MortalSurvivor

  
  release:
    needs: [export-windows, export-linux, export-mac]

    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: build-${{ github.run_number }}
          name: ${{ env.GAME_NAME }} Build ${{ github.run_number }}
          artifacts: artifacts/**/*.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true

    
