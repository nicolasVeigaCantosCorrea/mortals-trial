
name: export-game

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      preset:
        required: true
        type: string
      extension:
        required: true
        type: string
      game_name:
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Import game assets
        run: godot --headless --path . --import

      - name: Create build directory
        run: mkdir -p build/${{ inputs.game_name }}-${{ inputs.platform }}

      - name: Export game
        run: |
          godot --headless --path . --verbose \
            --export-release "${{ inputs.preset }}" \
            build/${{ inputs.game_name }}-${{ inputs.platform }}/${{ inputs.game_name }}.${{ inputs.extension }}

      - name: Zip build
        run: |
          zip -r ${{ inputs.game_name }}-${{ inputs.platform }}.zip \
            build/${{ inputs.game_name }}-${{ inputs.platform }}/

      - name: Upload game artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.game_name }}-${{ inputs.platform }}
          path: ${{ inputs.game_name }}-${{ inputs.platform }}.zip
          if-no-files-found: error
