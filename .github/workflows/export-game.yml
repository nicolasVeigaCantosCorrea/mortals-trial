name: export-game

on:
  workflow_call:
    inputs:
        platform:
            required: true
            type: string
        preset:
            required: true
            type: string
        extension:
            required: true
            type: string
        game_name:
            required: true
            type: string
        
jobs: 
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    container:
      image: barichello/godot-ci:4.6.2-stable

    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      
      - name: import game assets
        run: godot --headless --import || true
      
      - name: create build directory
        run: mkdir -p build/${{ inputs.game_name }}-${{ inputs.platform }}
        
      - name: setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.6.2.stable ~/.local/share/godot/export_templates/4.6.2.stable

      - name: export game
        run: godot --headless --verbose --export-release "${{ inputs.preset }}" build/${{ inputs.game_name }}-${{ inputs.platform }}/${{ inputs.game_name }}.${{ inputs.extension }}

      - name: zip build
        run: zip -r ${{ inputs.game_name }}-${{ inputs.platform }}.zip build/${{ inputs.game_name }}-${{ inputs.platform }}/

      - name: upload artifact(game) to github 
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.game_name }}-${{ inputs.platform }}
          path: ${{ inputs.game_name }}-${{ inputs.platform }}.zip